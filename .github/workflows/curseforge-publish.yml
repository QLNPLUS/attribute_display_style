name: Publish to CurseForge

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing versioned tag to build (for example v1.0.0-forge-1.20.1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: curseforge-${{ vars.CURSEFORGE_PROJECT_ID }}-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  publish-forge-1-20-1:
    if: >-
      (github.event_name == 'release' && endsWith(github.event.release.tag_name, '-forge-1.20.1')) ||
      (github.event_name == 'workflow_dispatch' && endsWith(inputs.tag, '-forge-1.20.1'))
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Remove local-only Gradle settings
        run: sed -i -E '/^systemProp\.(http|https)\.proxy(Host|Port)=|^org\.gradle\.java\.home=/d' gradle.properties

      - name: Validate release version
        shell: bash
        run: |
          if [[ "$RELEASE_TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-forge-1\.20\.1$ ]]; then
            version="${BASH_REMATCH[1]}"
          else
            echo "Invalid Forge 1.20.1 release tag: $RELEASE_TAG" >&2
            exit 1
          fi

          configured_version="$(sed -n 's/^mod_version=//p' gradle.properties | head -n 1 | tr -d '\r')"
          if [[ "$version" != "$configured_version" ]]; then
            echo "Tag version $version does not match mod_version $configured_version" >&2
            exit 1
          fi

          echo "CURSEFORGE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Validate CurseForge configuration
        env:
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          test -n "$CURSEFORGE_PROJECT_ID"
          test -n "$CURSEFORGE_TOKEN"

      - name: Build mod
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Verify release artifact
        shell: bash
        run: |
          expected="attribute_display_style-forge-1.20.1-${CURSEFORGE_VERSION}.jar"
          find build/libs -maxdepth 1 -type f -name '*.jar' -print
          test -f "build/libs/$expected"
          echo "CURSEFORGE_FILE=build/libs/$expected" >> "$GITHUB_ENV"

      - name: Prepare current changelog
        shell: bash
        run: |
          mkdir -p build
          if [[ -f CHANGELOG.md ]]; then
            awk -v version="$CURSEFORGE_VERSION" '
              /^##[[:space:]]+/ {
                heading = $2
                sub(/\r$/, "", heading)
                gsub(/^\[/, "", heading)
                gsub(/\].*$/, "", heading)
                if (found && heading != version) exit
                if (heading == version) found = 1
              }
              found { print }
            ' CHANGELOG.md > build/curseforge-changelog.md
            test -s build/curseforge-changelog.md
          elif [[ "$CURSEFORGE_VERSION" == "1.0.0" ]]; then
            printf '%s\n' 'Initial release of Attribute Display Style.' > build/curseforge-changelog.md
          else
            echo "CHANGELOG.md must contain a section for $CURSEFORGE_VERSION" >&2
            exit 1
          fi

      - name: Publish mod file to CurseForge
        uses: Kira-NT/mc-publish@v3
        with:
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: ${{ env.CURSEFORGE_FILE }}
          name: attribute_display_style-forge-1.20.1-${{ env.CURSEFORGE_VERSION }}
          version: ${{ env.CURSEFORGE_VERSION }}
          version-type: release
          changelog-file: build/curseforge-changelog.md
          loaders: forge
          game-versions: 1.20.1
          game-version-filter: none
          environment: client
          java: 17
