name: Publish to CurseForge

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing versioned tag to build (for example v1.1.0-neoforge-1.21.1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: curseforge-${{ vars.CURSEFORGE_PROJECT_ID }}-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Remove local-only Gradle settings
        shell: bash
        run: sed -i -E '/^systemProp\.(http|https)\.proxy(Host|Port)=|^org\.gradle\.java\.home=/d' gradle.properties

      - name: Resolve release target
        id: release
        shell: bash
        run: |
          case "$RELEASE_TAG" in
            v*-forge-1.20.1)
              loader="forge"; minecraft="1.20.1"; suffix="forge-1.20.1"; java="17"
              ;;
            v*-neoforge-1.20.4)
              loader="neoforge"; minecraft="1.20.4"; suffix="neoforge-1.20.4"; java="17"
              ;;
            v*-neoforge-1.21.1)
              loader="neoforge"; minecraft="1.21.1"; suffix="neoforge-1.21.1"; java="21"
              ;;
            v*-neoforge-26.1.2)
              loader="neoforge"; minecraft="26.1.2"; suffix="neoforge-26.1.2"; java="25"
              ;;
            *)
              echo "Unsupported release tag: $RELEASE_TAG" >&2
              exit 1
              ;;
          esac

          version="${RELEASE_TAG#v}"
          version="${version%-${suffix}}"
          expected_tag="v${version}-${suffix}"
          if [[ "$RELEASE_TAG" != "$expected_tag" || ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi

          configured_version="$(sed -n 's/^mod_version=//p' gradle.properties | head -n 1 | tr -d '\r')"
          if [[ "$version" != "$configured_version" ]]; then
            echo "Tag version $version does not match mod_version $configured_version" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "loader=$loader" >> "$GITHUB_OUTPUT"
          echo "minecraft=$minecraft" >> "$GITHUB_OUTPUT"
          echo "java=$java" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ steps.release.outputs.java }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Validate CurseForge configuration
        env:
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        shell: bash
        run: |
          test -n "$CURSEFORGE_PROJECT_ID"
          test -n "$CURSEFORGE_TOKEN"

      - name: Build mod
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Verify release artifact
        id: artifact
        shell: bash
        env:
          LOADER: ${{ steps.release.outputs.loader }}
          MINECRAFT: ${{ steps.release.outputs.minecraft }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          expected="attribute_display_style-$LOADER-$MINECRAFT-$VERSION.jar"
          find build/libs -maxdepth 1 -type f -name '*.jar' -print
          test -f "build/libs/$expected"
          echo "file=build/libs/$expected" >> "$GITHUB_OUTPUT"

      - name: Prepare current changelog
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          mkdir -p build
          if [[ -f CHANGELOG.md ]]; then
            awk -v version="$VERSION" '
              /^##[[:space:]]+/ {
                heading = $2
                sub(/\r$/, "", heading)
                gsub(/^\[/, "", heading)
                gsub(/\].*$/, "", heading)
                if (found && heading != version) exit
                if (heading == version) found = 1
              }
              found { print }
            ' CHANGELOG.md > build/curseforge-changelog.md
            test -s build/curseforge-changelog.md
          else
            echo "CHANGELOG.md is missing" >&2
            exit 1
          fi

      - name: Publish mod file to CurseForge
        uses: Kira-NT/mc-publish@v3
        with:
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: ${{ steps.artifact.outputs.file }}
          name: attribute_display_style-${{ steps.release.outputs.loader }}-${{ steps.release.outputs.minecraft }}-${{ steps.release.outputs.version }}
          version: ${{ steps.release.outputs.version }}
          version-type: release
          changelog-file: build/curseforge-changelog.md
          loaders: ${{ steps.release.outputs.loader }}
          game-versions: ${{ steps.release.outputs.minecraft }}
          game-version-filter: none
          environment: client
          java: ${{ steps.release.outputs.java }}
