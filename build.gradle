plugins {
    id 'java-library'
    id 'idea'
    id 'eclipse'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.0.97'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id + '-neoforge-' + minecraft_version
}

java.toolchain.languageVersion = JavaLanguageVersion.of(java_version)

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        modSource project.sourceSets.main
    }
    client {}
    server {
        programArgument '--nogui'
    }
}

repositories {
    mavenCentral()
    maven { name = 'NeoForged'; url = 'https://maven.neoforged.net/releases' }
    maven { name = 'SpongePowered'; url = 'https://repo.spongepowered.org/repository/maven-public/' }
}

dependencies {
    implementation "net.neoforged:neoforge:${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
        minecraft_version: minecraft_version,
        minecraft_version_range: minecraft_version_range,
        forge_version_range: forge_version_range,
        loader_version_range: loader_version_range,
        mod_id: mod_id,
        mod_group_id: mod_group_id,
        mod_name: mod_name,
        mod_license: mod_license,
        mod_version: mod_version,
        mod_authors: mod_authors,
        mod_description: mod_description,
        java_version: java_version
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') { expand replaceProperties }
    filesMatching('attribute_display_style.mixins.json') { expand replaceProperties }
    exclude 'META-INF/mods.toml'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += "-AoutRefMapFile=${buildDir}/${mod_id}.refmap.json"
}

tasks.named('processResources') {
    dependsOn tasks.named('compileJava')
    from(file("${buildDir}/${mod_id}.refmap.json"))
}

tasks.named('jar', Jar).configure {
    from(file("${buildDir}/${mod_id}.refmap.json"))
}

java {
    withSourcesJar()
}
